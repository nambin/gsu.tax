<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSU Tax Calculator</title>
    <style>
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --primary-color: #bb86fc;
        --secondary-color: #03dac6;
        --error-color: #cf6679;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --border-color: #333333;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      header {
        width: 100%;
        padding: 20px;
        background-color: var(--surface-color);
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 40px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 500;
      }
      .container {
        width: 100%;
        max-width: 800px;
        padding: 20px;
      }
      .drop-zone {
        border: 2px dashed var(--border-color);
        border-radius: 8px;
        padding: 60px 20px;
        text-align: center;
        background-color: var(--surface-color);
        transition: all 0.2s ease;
        cursor: pointer;
        margin-bottom: 20px;
      }
      .drop-zone:hover, .drop-zone.dragover {
        border-color: var(--primary-color);
        background-color: rgba(187, 134, 252, 0.05);
      }
      .drop-zone p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 16px;
      }
      #file-input {
        display: none;
      }
      .log-container {
        background-color: var(--surface-color);
        border-radius: 8px;
        padding: 20px;
        min-height: 150px;
        max-height: 400px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 14px;
        border: 1px solid var(--border-color);
      }
      .log-entry {
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .log-success { color: var(--secondary-color); }
      .log-error { color: var(--error-color); }
      .log-info { color: var(--text-secondary); }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        justify-content: flex-end;
      }
      button {
        background-color: var(--surface-color);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover:not(:disabled) {
        background-color: #2c2c2c;
        border-color: var(--text-secondary);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .primary-btn {
        background-color: var(--primary-color);
        color: #000;
        border-color: var(--primary-color);
        font-weight: 500;
      }
      .primary-btn:hover:not(:disabled) {
        background-color: #d0a8ff;
        border-color: #d0a8ff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GSU Tax Calculator</h1>
    </header>
    <div class="container">
      <div id="drop-zone" class="drop-zone">
        <p>Drag & Drop Morgan Stanley MHTML files here<br>or click to select (Max 150 files)</p>
        <input type="file" id="file-input" multiple accept=".mhtml" />
      </div>

      <div class="log-container" id="log-container">
        <div class="log-entry log-info">Ready to process files.</div>
      </div>

      <div class="actions">
        <button id="download-full-btn" disabled>Download Full Verification (CSV)</button>
        <button id="download-tax-btn" class="primary-btn" disabled>Download Tax Filing (CSV)</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
