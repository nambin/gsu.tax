<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link id="favicon" rel="icon" type="image/png" href="favicon_antigravity.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 4rem 5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 2.5rem;
            margin-top: 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 10px -5px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="greetingText">Hello World</h1>
        <button id="clickButton">Click !</button>
    </div>

    <script>
        const button = document.getElementById('clickButton');
        const greeting = document.getElementById('greetingText');

        button.addEventListener('click', () => {
            // Fade out the text
            greeting.style.opacity = 0;
            greeting.style.transform = 'translateY(-10px)';

            setTimeout(() => {
                // Change the text and its gradient color
                greeting.textContent = 'Hello Antigravity !';
                greeting.style.background = 'linear-gradient(135deg, #a855f7, #ec4899)';
                greeting.style.webkitBackgroundClip = 'text';
                greeting.style.webkitTextFillColor = 'transparent';

                // Fade it back in with a slight pop animation
                greeting.style.opacity = 1;
                greeting.style.transform = 'translateY(0)';
            }, 300); // Wait for fade-out to finish
        });
    </script>
</body>

</html>
